; ipu.co.in — PHP-FPM per-directory config
; Picked up by PHP-FPM with user_ini.cache_ttl=300 (5-min refresh, no restart needed)

; --- Cache headers ---
; Default PHP session emits Cache-Control: no-cache,no-store,must-revalidate which
; kills CDN + browser caching. "public" makes session-bearing GETs cacheable.
; session.cache_expire is in MINUTES -> max-age = 30 * 60 = 1800s
session.cache_limiter = public
session.cache_expire = 30

; --- Session hardening ---
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

